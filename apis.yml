aid: boom-ai
name: Boom Ai
description: >-
  Boom AI (useboom.ai) is a Y Combinator-backed (Fall 2025) San Francisco company
  building "an AI workforce for your customers" — autonomous agents that hold real,
  multi-turn conversations over SMS, email, WhatsApp, and phone in 50+ languages to
  run collections and payment recovery, churn recovery, retention monitoring, customer
  onboarding, sales qualification, and market research for e-commerce and B2B brands.
  Boom exposes one uniform public REST API — and a hosted MCP server over the same
  capabilities — covering a customer data platform (people, custom objects, behavioral
  events, relationships, sources), segments, initiatives and participants, and journey
  authoring. Authentication is a Bearer organization API key (boom_org_...); the API
  uses cursor pagination, 1,000 requests/minute rate limits with X-RateLimit-*/Retry-After
  signaling, and idempotent upsert plus up-to-1000-record batch endpoints.
