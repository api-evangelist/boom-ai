rest_only_note: >-
  These 24 operations are NOT asserted to be missing from MCP. Boom states the two
  surfaces are identical, and the live tools/list is auth-gated, so this section records
  only that the provider's own published skills never name a tool for them. Six of them
  (initiatives_pause, initiatives_resume, initiatives_transcripts_list, journeys_stop,
  extraction_reextract, environments_list) are operations that appeared in the live
  OpenAPI after the skills were last published (2026-07-28), which is the most likely
  explanation. Confirming MCP coverage requires an authenticated tools/list.
known_gaps:
  - >-
    Boom documents one real REST/MCP divergence itself: the journey email-send step is
    not in the authoring catalog, so an agent cannot add one over MCP — it must be built
    in the Boom app (https://docs.useboom.ai/use-mcp).
  - >-
    Data-source sync (PostgreSQL/MySQL/Shopify/Skio) is UI-only and on neither surface
    (https://docs.useboom.ai/connect-your-database).
