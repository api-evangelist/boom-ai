notes: >-
  Three real discovery surfaces are served. (1) The hosted MCP server at
  https://www.useboom.ai/mcp answers 401 with a WWW-Authenticate challenge naming
  resource_metadata https://www.useboom.ai/.well-known/oauth-protected-resource/mcp,
  which resolves to a valid RFC 9728 document pointing at the Clerk-operated
  authorization server https://clerk.useboom.ai. (2) docs.useboom.ai serves an A2A
  agent card and the Agent Skill it references. (3) docs.useboom.ai/.well-known/mcp.json
  is a Mintlify docs-search MCP descriptor, whose url resolves to a
  *.mintlify.me preview host rather than a Boom-controlled endpoint — recorded as
  observed, but it is the docs platform's server, not Boom's product MCP server.
  No security.txt is published on any host.
