    get:
      operationId: journeys_get
      summary: Get journey
      description: Get one journey by id — its trigger and the ordered steps people move through. Read-only, for inspecting setup.
      tags:
      - Journeys
      parameters:
      - name: journeyId
        in: path
        required: true
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: string
          minLength: 1
          description: Journey id.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  id:
                    type: string
                    description: Journey id.
                  initiativeId:
                    type: string
                    description: The initiative this journey belongs to.
                  name:
                    type: string
                    description: Journey name (from its initiative).
                  status:
                    type: string
                    enum:
                    - DRAFT
                    - ACTIVE
                    - ARCHIVED
                    description: DRAFT (still being configured), ACTIVE (live — people can move through it), or ARCHIVED (no longer running).
                  version:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                    description: Version number of the journey's current setup. Each time the steps are edited and re-activated, the version increases.
                  createdAt:
                    type: string
                    description: ISO 8601 timestamp.
                  updatedAt:
                    type: string
                    description: ISO 8601 timestamp.
                  trigger:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - manual
                        - segment
                        - event
                        description: 'How people enter the journey: manual (added by an operator or API call), segment (added when they enter a segment), or event (added when an event is received for them).'
                      segment:
                        anyOf:
                        - type: string
                        - type: 'null'
                        description: Segment name, when type is segment.
                      event:
                        anyOf:
                        - type: string
                        - type: 'null'
                        description: Event name, when type is event.
                    required:
                    - type
                    - segment
                    - event
                    additionalProperties: false
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Step id, unique within the journey.
                        type:
                          type: string
                          enum:
                          - entry
                          - message
                          - conversation
                          - wait
                          - branch
                          - split
                          - event
                          - end
                          - step
                          description: 'What the step does: entry (where people start), message (sends a message template), conversation (an AI-led conversation), wait (pauses before continuing), branch (routes down a yes or no path), split (routes across several cases), event (records an event), end (finishes the journey), or step (a step of another kind).'
                        title:
                          description: The name the journey author gave this step.
                          type: string
                        description:
                          description: Plain-language summary of what the step is configured to do.
                          type: string
                      required:
                      - id
                      - type
                      additionalProperties: false
                    description: The steps that make up the journey, in the order a person moves through them.
                required:
