  /api/v1/journeys/validate:
    post:
      operationId: journeys_validate
      summary: Validate journey
      description: Dry-run the publish checks against a journey graph without saving. Returns whether it is valid and the list of issues (errors block publishing; warnings are advisory). Use it to iterate a draft to valid before publishing in the app.
      tags:
      - Journeys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                definition:
                  type: object
                  properties:
                    id:
                      description: Journey id; carried for round-trip ergonomics. Optional on create.
                      type: string
                    name:
                      type: string
                      minLength: 1
                      description: Journey name.
                    metadata:
                      type: object
                      properties:
                        initiativeType:
                          type: string
                        version:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        cancelOnEvents:
                          description: Cancel an in-flight run when any of these events arrive.
                          type: object
                          properties:
                            eventNames:
                              type: array
                              items:
                                type: string
                          required:
                          - eventNames
                      description: Optional journey-level metadata.
                    actions:
                      minItems: 1
                      type: array
                      items:
                        oneOf:
                        - type: object
                          properties:
                            id:
                              type: string
                              minLength: 1
                              description: Node id, unique within the journey.
                            kind:
                              type: string
                              const: ENTRY
                            name:
                              type: string
                              minLength: 1
