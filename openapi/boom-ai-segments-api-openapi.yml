                                    - ends_with
                                    - gt
                                    - gte
                                    - lt
                                    - lte
                                    - 'on'
                                    - before
                                    - after
                                    - between
                                    - in_last_n
                                    - in_next_n
                                    - more_than_n_ago
                                    - more_than_n_from_now
                                    - exactly_n_from_today
