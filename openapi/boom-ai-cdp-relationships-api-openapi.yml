    post:
      operationId: cdp_relationship_types_register
      summary: Register relationship type
      description: Register a relationship type and its metadata. Re-registering an existing type updates it in place.
      tags:
      - CDP Relationships
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                kind:
                  type: string
                  enum:
                  - person_to_co
                  - co_to_co
                  description: Type kind. 'person_to_co' links people to one custom object type; 'co_to_co' links two custom object types.
                role:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Edge role, e.g. "placed" or "has_line_item".
                customObjectType:
                  description: Custom object type name. Required when kind is 'person_to_co'.
                  type: string
                  minLength: 1
                  maxLength: 255
                parentCustomObjectType:
                  description: Parent custom object type name. Required when kind is 'co_to_co'.
                  type: string
                  minLength: 1
                  maxLength: 255
                childCustomObjectType:
                  description: Child custom object type name. Required when kind is 'co_to_co'.
                  type: string
                  minLength: 1
                  maxLength: 255
                cardinality:
                  description: 'Optional cardinality: ONE_TO_ONE, ONE_TO_MANY, MANY_TO_ONE, MANY_TO_MANY.'
                  type: string
                  enum:
                  - ONE_TO_ONE
                  - ONE_TO_MANY
                  - MANY_TO_ONE
                  - MANY_TO_MANY
                description:
                  description: Optional human-readable description of the relationship type.
                  type: string
                  minLength: 1
                  maxLength: 1000
                bidirectional:
                  description: 'Optional: whether the relationship is bidirectional.'
                  type: boolean
              required:
              - kind
              - role
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                allOf:
                - anyOf:
                  - type: object
                    properties:
                      kind:
                        type: string
                        const: person_to_co
                      customObjectType:
                        type: string
                      relationshipTypeId:
                        type: string
                      role:
                        type: string
                        description: Edge role, e.g. "placed" or "has_line_item".
                      cardinality:
                        anyOf:
                        - type: string
                          enum:
                          - ONE_TO_ONE
                          - ONE_TO_MANY
                          - MANY_TO_ONE
                          - MANY_TO_MANY
                        - type: 'null'
                      description:
                        anyOf:
                        - type: string
                        - type: 'null'
                      bidirectional:
                        type: boolean
                    required:
                    - kind
                    - customObjectType
                    - relationshipTypeId
                    - role
                    - cardinality
                    - description
                    - bidirectional
                    additionalProperties: false
                  - type: object
                    properties:
                      kind:
                        type: string
                        const: co_to_co
                      parentCustomObjectType:
                        type: string
                      childCustomObjectType:
                        type: string
                      relationshipTypeId:
                        type: string
                      role:
                        type: string
                        description: Edge role, e.g. "placed" or "has_line_item".
                      cardinality:
                        anyOf:
                        - type: string
                          enum:
                          - ONE_TO_ONE
                          - ONE_TO_MANY
                          - MANY_TO_ONE
                          - MANY_TO_MANY
                        - type: 'null'
                      description:
                        anyOf:
                        - type: string
                        - type: 'null'
                      bidirectional:
                        type: boolean
                    required:
                    - kind
                    - parentCustomObjectType
                    - childCustomObjectType
                    - relationshipTypeId
                    - role
                    - cardinality
                    - description
                    - bidirectional
                    additionalProperties: false
                - type: object
                  properties:
                    created:
                      type: boolean
                  required:
                  - created
                  additionalProperties: false
        '400':
          description: Validation failed or the request cannot proceed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
