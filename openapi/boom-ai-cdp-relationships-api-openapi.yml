  /api/v1/cdp/relationships:
    delete:
      operationId: cdp_relationships_unlink
      summary: Unlink relationship
      description: Unlink (soft-delete) a relationship. Idempotent.
      tags:
      - CDP Relationships
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Edge kind. 'person_to_co' (default) links a person to a custom object; 'co_to_co' links a parent custom object to a child custom object.
          type: string
          enum:
          - person_to_co
          - co_to_co
      - name: relationshipTypeId
        in: query
        required: true
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: string
          minLength: 1
          maxLength: 255
          description: Id of the relationship type (from the relationship-types list). Fixes the role and the custom object type(s) the edge targets.
      - name: personExternalId
        in: query
        required: false
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Person externalId. Required when kind is 'person_to_co'.
          type: string
          minLength: 1
          maxLength: 255
      - name: customObjectExternalId
        in: query
        required: false
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Custom object externalId. Required when kind is 'person_to_co'.
          type: string
          minLength: 1
          maxLength: 255
      - name: parentExternalId
        in: query
        required: false
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Parent custom object externalId. Required when kind is 'co_to_co'.
          type: string
          minLength: 1
          maxLength: 255
      - name: childExternalId
        in: query
        required: false
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Child custom object externalId. Required when kind is 'co_to_co'.
          type: string
          minLength: 1
          maxLength: 255
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  removed:
                    type: boolean
                required:
                - removed
                additionalProperties: false
        '400':
          description: Validation failed or the request cannot proceed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
