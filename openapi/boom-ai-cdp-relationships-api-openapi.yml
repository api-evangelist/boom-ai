        '200':
          description: Success
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  data:
                    type: array
                    items:
                      anyOf:
                      - type: object
                        properties:
                          kind:
                            type: string
                            const: person_to_co
                          customObjectType:
                            type: string
                          relationshipTypeId:
                            type: string
                          role:
                            type: string
                            description: Edge role, e.g. "placed" or "has_line_item".
                          cardinality:
                            anyOf:
                            - type: string
                              enum:
                              - ONE_TO_ONE
                              - ONE_TO_MANY
                              - MANY_TO_ONE
                              - MANY_TO_MANY
                            - type: 'null'
                          description:
                            anyOf:
                            - type: string
                            - type: 'null'
                          bidirectional:
                            type: boolean
                        required:
                        - kind
                        - customObjectType
                        - relationshipTypeId
                        - role
                        - cardinality
                        - description
                        - bidirectional
                        additionalProperties: false
                      - type: object
                        properties:
                          kind:
                            type: string
                            const: co_to_co
                          parentCustomObjectType:
                            type: string
                          childCustomObjectType:
                            type: string
                          relationshipTypeId:
                            type: string
                          role:
                            type: string
                            description: Edge role, e.g. "placed" or "has_line_item".
                          cardinality:
                            anyOf:
                            - type: string
                              enum:
                              - ONE_TO_ONE
                              - ONE_TO_MANY
                              - MANY_TO_ONE
                              - MANY_TO_MANY
                            - type: 'null'
                          description:
                            anyOf:
                            - type: string
                            - type: 'null'
                          bidirectional:
                            type: boolean
                        required:
                        - kind
                        - parentCustomObjectType
                        - childCustomObjectType
                        - relationshipTypeId
                        - role
                        - cardinality
                        - description
                        - bidirectional
                        additionalProperties: false
                  next_cursor:
                    type: 'null'
                required:
                - data
                - next_cursor
                additionalProperties: false
        '400':
          description: Validation failed or the request cannot proceed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Stable machine-readable error code (snake_case).
                      message:
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
        '401':
          description: Missing, malformed, or revoked API key.
          content:
            application/json:
              schema:
                type: object
