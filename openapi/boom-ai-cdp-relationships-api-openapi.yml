  /api/v1/cdp/relationships/batch:
    post:
      operationId: cdp_relationships_batch
      summary: Batch link / unlink
      description: Link or unlink up to 1000 relationships in one request.
      tags:
      - CDP Relationships
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                items:
                  minItems: 1
                  maxItems: 1000
                  type: array
                  items:
                    oneOf:
                    - type: object
                      properties:
                        kind:
                          type: string
                          const: person_to_co
                        personExternalId:
                          type: string
                          minLength: 1
                          maxLength: 255
                          description: Person externalId.
                        customObjectExternalId:
                          type: string
                          minLength: 1
                          maxLength: 255
                          description: Custom object externalId.
                        relationshipTypeId:
                          type: string
                          minLength: 1
                          maxLength: 255
                          description: Relationship type id (from the relationship-types list).
                        remove:
                          description: Set true to unlink (soft-delete) instead of link.
                          type: boolean
                      required:
                      - kind
                      - personExternalId
                      - customObjectExternalId
                      - relationshipTypeId
                    - type: object
                      properties:
                        kind:
                          type: string
                          const: co_to_co
                        parentExternalId:
                          type: string
                          minLength: 1
                          maxLength: 255
                          description: Parent custom object externalId.
                        childExternalId:
                          type: string
                          minLength: 1
                          maxLength: 255
                          description: Child custom object externalId.
                        relationshipTypeId:
                          type: string
                          minLength: 1
                          maxLength: 255
                          description: Relationship type id (from the relationship-types list).
                        remove:
                          description: Set true to unlink (soft-delete) instead of link.
                          type: boolean
                      required:
                      - kind
                      - parentExternalId
                      - childExternalId
                      - relationshipTypeId
                  description: Relationships to link or unlink.
              required:
              - items
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  summary:
                    type: object
                    properties:
                      total:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      created:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      reactivated:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                        description: Previously-unlinked edges that were re-activated.
                      removed:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      failed:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                    required:
                    - total
                    - created
                    - reactivated
                    - removed
                    - failed
                    additionalProperties: false
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                          description: Zero-based index of the failed item.
                        externalId:
                          type: string
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                              description: Stable machine-readable error code (snake_case).
                            message:
                              type: string
                          required:
                          - code
                          - message
                          additionalProperties: false
                      required:
                      - index
                      - error
                      additionalProperties: false
                required:
                - summary
                - errors
                additionalProperties: false
