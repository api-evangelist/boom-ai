        in: path
        required: true
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: string
          minLength: 1
          description: Participant id, as returned when adding or listing.
      - name: limit
        in: query
        required: false
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Most-recent steps to return (default 50, max 200). Bounded tail — no older-page cursor; compare against totalSteps.
          type: integer
          minimum: 1
          maximum: 200
      - name: includeBody
        in: query
        required: false
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: 'Include HTTP_REQUEST bodies in step output: the response `body` (verbatim from the third party — may carry PII) and the resolved `requestBody` (credential secrets, env values, and document URLs are always masked at capture). Defaults to false: bodies are stripped; failure `reason` is always included.'
          type: boolean
