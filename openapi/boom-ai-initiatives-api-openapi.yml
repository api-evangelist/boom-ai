  /api/v1/initiatives/{id}/participants/{participantId}/steps:
    get:
      operationId: initiatives_participant_steps_list
      summary: Participant run steps
      description: 'The participant''s node-by-node journey run timeline (most recent first): which nodes ran, the routing signal each emitted, and bounded handler output/error. Engine execution history — for what the customer said, use the messages endpoint.'
      tags:
      - Initiatives
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: string
          minLength: 1
          description: Initiative id.
