        '200':
          description: Success
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  participantId:
                    type: string
                  totalSteps:
                    type: number
                    description: Full step count, even when more than `limit` were returned.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        nodeId:
                          type: string
                        nodeKind:
                          type: string
                          description: The workflow node kind, e.g. HTTP_REQUEST.
