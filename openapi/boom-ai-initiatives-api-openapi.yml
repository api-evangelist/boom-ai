  /api/v1/initiatives/{id}/reextract:
    post:
      operationId: extraction_reextract
      summary: Re-extract conversations
      description: Re-run extraction over an initiative's existing conversations — the fix for participants whose replies were never read (a schema authored after the conversations happened, or an initiative that never had extraction run at all). Start with dryRun to see how many conversations are eligible and how many actually carry enough transcript to extract from. Only conversations with at least 3 messages including one reply can produce anything.
      tags:
      - Initiatives
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                dryRun:
                  default: false
                  description: Count what would run without queueing anything. Do this first — the counts tell you whether re-extraction is worth the spend.
                  type: boolean
                force:
                  default: false
                  description: Re-extract conversations already extracted at the current schema version. Off by default, so a plain call only fills gaps.
                  type: boolean
                fromDate:
                  description: Only consider conversations created at or after this ISO 8601 instant.
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: string
          minLength: 1
          description: The initiative id.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  initiativeId:
                    type: string
                  eligible:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                    description: Conversations targeted for re-extraction.
                  queued:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                    description: Extractions actually enqueued — always 0 on a dry run.
                  willExtract:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                    description: Of the eligible set, how many carry enough transcript to produce values.
                  insufficient:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                    description: Eligible but below the analyzability bar (under 3 messages, or no reply on this initiative) — these will be marked INSUFFICIENT_DATA rather than extracted. A high number here usually means the replies live on a different initiative.
                  dryRun:
                    type: boolean
                required:
                - initiativeId
                - eligible
                - queued
                - willExtract
                - insufficient
                - dryRun
                additionalProperties: false
        '400':
          description: Validation failed or the request cannot proceed.
