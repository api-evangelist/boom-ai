openapi: 3.2.0
info:
  title: Boom WhatsApp templates API
  version: 1.0.0
  description: 'Boom''s public REST API — one uniform surface over every platform capability. CDP: upsert people and custom objects, define object and relationship types, link and unlink relationships, and record behavioral events — one record per request or up to 1000 per request via the `/batch` endpoints. Segments: read (list, read, membership) and full authoring — discover the filterable catalog, validate a filter, create and update segments, preview match counts, and trigger evaluation. Initiatives: create and configure outreach initiatives, link WhatsApp templates, drive the lifecycle (launch, cancel, archive), and read collected-data summaries. Participants: enroll people into an active initiative, track their status, read conversation transcripts, and stop outreach. Journeys: read-only access to always-on message flows and their metrics. WhatsApp templates: list your WhatsApp numbers and list, read, and create message templates. The same capabilities are exposed as MCP tools with identical schemas.'
servers:
- url: https://www.useboom.ai
  description: Production
- url: https://dev.useboom.ai
  description: Development (sandbox — use a development organization API key)
security:
- bearerAuth: []
tags:
- name: WhatsApp templates
paths:
  /api/v1/templates:
    get:
      operationId: templates_list
      summary: List templates
      description: List your WhatsApp templates and each one's approval status. Reviews are async (~24–48h) — re-read to see updates.
      tags:
      - WhatsApp templates
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: string
          enum:
          - DRAFT
          - PENDING
          - APPROVED
          - REJECTED
      - name: category
        in: query
        required: false
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: string
          enum:
          - UTILITY
          - MARKETING
          - AUTHENTICATION
      - name: contentType
        in: query
        required: false
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: string
          enum:
          - TEXT
          - MEDIA
          - QUICK_REPLY
          - CALL_TO_ACTION
          - CARD
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Template id.
                        name:
                          type: string
                          description: Template name (unique per WhatsApp number).
                        language:
                          type: string
                          description: WhatsApp language code the template was created for, e.g. `es_MX`.
                        category:
                          type: string
                          enum:
                          - UTILITY
                          - MARKETING
                          - AUTHENTICATION
                        contentType:
                          type: string
                          enum:
                          - TEXT
                          - MEDIA
                          - QUICK_REPLY
                          - CALL_TO_ACTION
                          - CARD
                        content:
                          description: The message content (shape per `contentType`).
                        variables:
                          anyOf:
                          - type: object
                            propertyNames:
                              type: string
                            additionalProperties:
                              type: string
                          - type: 'null'
                          description: Example values for `{{1}}`-style placeholders.
                        phoneNumbers:
                          type: array
                          items:
                            type: string
                          description: WhatsApp numbers this template can be sent from.
                        status:
                          type: string
                          enum:
                          - DRAFT
                          - PENDING
                          - APPROVED
                          - REJECTED
                          description: DRAFT (not yet submitted), PENDING (in WhatsApp review, typically 24-48h), APPROVED, or REJECTED (see rejectionReason).
                        rejectionReason:
                          anyOf:
                          - type: string
                          - type: 'null'
                        createdAt:
                          type: string
                          description: ISO 8601 timestamp.
                        updatedAt:
                          type: string
                          description: ISO 8601 timestamp.
                      required:
                      - id
                      - name
                      - language
                      - category
                      - contentType
                      - content
                      - variables
                      - phoneNumbers
                      - status
                      - rejectionReason
                      - createdAt
                      - updatedAt
                      additionalProperties: false
                  next_cursor:
                    type: 'null'
                required:
                - data
                - next_cursor
                additionalProperties: false
        '400':
          description: Validation failed or the request cannot proceed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Stable machine-readable error code (snake_case).
                      message:
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
        '401':
          description: Missing, malformed, or revoked API key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Stable machine-readable error code (snake_case).
                      message:
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
        '404':
          description: The resource does not exist in this organization.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Stable machine-readable error code (snake_case).
                      message:
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
        '409':
          description: Conflicts with the current state (duplicates, wrong lifecycle state).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Stable machine-readable error code (snake_case).
                      message:
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
        '422':
          description: The request is well-formed but semantically invalid.
          content:
